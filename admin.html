<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uchrashuvlar Boshqaruv Paneli (Admin) 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f4f6f9; color: #333; padding: 30px 15px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .title { color: #d63384; font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .refresh-btn { background: #ff416c; color: white; border: none; padding: 10px 18px; border-radius: 30px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .refresh-btn:hover { background: #e0325a; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; }
        th, td { padding: 14px 16px; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #fff0f5; color: #d63384; font-weight: 600; }
        tr:hover { background: #fafafa; }
        .badge { background: #e6f9ed; color: #27ae60; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .empty-state { text-align: center; padding: 40px; color: #888; font-size: 15px; }
        .delete-btn { color: #e74c3c; cursor: pointer; border: none; background: none; font-size: 16px; }
        .delete-btn:hover { color: #c0392b; }
        .note-text { font-style: italic; color: #555; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="title">
                <i class="fa-solid fa-heart-pulse"></i> Uchrashuvlar Boshqaruv Paneli
            </div>
            <button class="refresh-btn" onclick="fetchBookings()">
                <i class="fa-solid fa-rotate-right"></i> Yangilash
            </button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Uchrashuv Joyi</th>
                        <th>Sana va Vaqt</th>
                        <th>Shirinlik / Ichimlik</th>
                        <th>Maxsus Xabar</th>
                        <th>Vaqti (Yuborilgan)</th>
                        <th>Amal</th>
                    </tr>
                </thead>
                <tbody id="bookingsTableBody">
                    <tr><td colspan="7" class="empty-state">Yuklanmoqda...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchBookings() {
            const tbody = document.getElementById('bookingsTableBody');
            tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i> Yuklanmoqda...</td></tr>';

            try {
                const res = await fetch('/api/bookings');
                const data = await res.json();

                if (!data.bookings || data.bookings.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Hali hech kim uchrashuv belgilamadi 💔</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                data.bookings.forEach((b, idx) => {
                    const tr = document.createElement('tr');
                    const dateFormatted = new Date(b.createdAt).toLocaleString('uz-UZ');
                    tr.innerHTML = `
                        <td>${idx + 1}</td>
                        <td><strong>${b.place}</strong></td>
                        <td><span class="badge">${b.date} - ${b.time}</span></td>
                        <td>${b.treat || '-'}</td>
                        <td class="note-text">${b.note ? '"' + b.note + '"' : '-'}</td>
                        <td><small style="color: #999">${dateFormatted}</small></td>
                        <td><button class="delete-btn" onclick="deleteBooking('${b.id}')" title="O'chirish"><i class="fa-solid fa-trash-can"></i></button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state" style="color:red">Ma\'lumotlarni olishda xatolik yuz berdi</td></tr>';
            }
        }

        async function deleteBooking(id) {
            if (!confirm("Haqiqatan ham ushbu yozuvni o'chirmoqchimisiz?")) return;
            try {
                await fetch(`/api/bookings/${id}`, { method: 'DELETE' });
                fetchBookings();
            } catch (e) {
                alert('O\'chirishda xatolik');
            }
        }

        // Auto load
        fetchBookings();
    </script>
</body>
</html>
